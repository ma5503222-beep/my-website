<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MindSketch Agency</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Cairo;background:#0b1220;color:#fff;overflow-x:hidden}

html{scroll-behavior:smooth}

/* NAV */
nav{
position:fixed;top:0;width:100%;z-index:1000;
display:flex;justify-content:space-between;align-items:center;
padding:15px 40px;
background:rgba(0,0,0,.4);
backdrop-filter:blur(10px);
}
.logo{display:flex;align-items:center;gap:10px}
.logo img{width:40px;animation:float 3s infinite}
@keyframes float{50%{transform:translateY(-5px)}}

/* HERO */
.hero{
height:100vh;
display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;
background:linear-gradient(120deg,#0b1220,#111a2e);
}
.hero h1{
font-size:55px;
background:linear-gradient(90deg,#22c55e,#06b6d4);
-webkit-background-clip:text;
color:transparent;
animation:fadeUp 1s ease;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(40px)}to{opacity:1}}

.btn{
background:linear-gradient(135deg,#22c55e,#06b6d4);
padding:12px 25px;
border-radius:30px;
border:none;
color:#fff;
cursor:pointer;
margin-top:10px;
transition:.3s;
}
.btn:hover{transform:scale(1.1)}

section{padding:90px 40px;text-align:center}
.title{font-size:34px;margin-bottom:30px}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:#111a2e;
padding:25px;
border-radius:15px;
transition:.3s;
}
.card:hover{transform:translateY(-10px)}

/* PROJECTS */
.projects{
column-count:3;
column-gap:15px;
}
.project{
break-inside:avoid;
margin-bottom:15px;
border-radius:10px;
overflow:hidden;
}
.project img{width:100%;transition:.5s}
.project:hover img{transform:scale(1.1);filter:brightness(.6)}

/* FORM */
.form{
background:#111a2e;
padding:30px;
border-radius:15px;
max-width:500px;
margin:auto;
}
.form input{
width:100%;
padding:12px;
margin:8px 0;
border:none;
border-radius:8px;
background:#0f172a;
color:#fff;
}

/* TABLE */
.table div{
background:#111;
margin:5px;
padding:10px;
border-radius:8px;
}

/* CTA */
.cta{
background:linear-gradient(135deg,#22c55e,#06b6d4);
padding:60px;
border-radius:20px;
animation:pulse 2s infinite;
}
@keyframes pulse{50%{transform:scale(1.03)}}

</style>
</head>

<body>

<nav>
<div class="logo">
<img src="logo.png"><span>MindSketch</span>
</div>
</nav>

<!-- HERO -->
<section class="hero">
<h1>نصمم ونبني ونبيع 🔥</h1>
<p>Branding • Design • Courses</p>
<button class="btn">ابدأ الآن</button>
</section>

<!-- SERVICES -->
<section>
<h2 class="title">الخدمات</h2>
<div class="grid">
<div class="card">تصميم سوشيال</div>
<div class="card">لوجو</div>
<div class="card">هوية بصرية</div>
</div>
</section>

<!-- PACKAGES -->
<section>
<h2 class="title">الباقات</h2>
<div class="grid">
<div class="card">Basic</div>
<div class="card">Pro</div>
<div class="card">Elite</div>
</div>
</section>

<!-- PROJECTS -->
<section>
<h2 class="title">الأعمال</h2>
<div class="projects" id="projects"></div>
</section>

<!-- BOOKING -->
<section>
<h2 class="title">احجز الآن</h2>

<div class="form">
<input id="name" placeholder="الاسم">
<input id="phone" placeholder="رقم الهاتف">
<input id="service" placeholder="الخدمة">

<button class="btn" onclick="saveBooking()">احجز</button>
</div>

<br>
<button class="btn" onclick="exportExcel()">تحميل Excel 📥</button>

<div class="table" id="data"></div>

</section>

<!-- CTA -->
<section class="cta">
<h2>عدد محدود أسبوعيًا ⏳</h2>
</section>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey: "YOUR_KEY",
authDomain: "YOUR_DOMAIN",
projectId: "YOUR_ID",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.db = db;
window.getDocs = getDocs;
window.collection = collection;

/* SAVE */
window.saveBooking = async function(){

let name = document.getElementById("name").value;
let phone = document.getElementById("phone").value;
let service = document.getElementById("service").value;

if(!name || !phone){
alert("املأ البيانات");
return;
}

await addDoc(collection(db,"clients"),{
name,phone,service,date:new Date()
});

alert("تم الحجز 🔥");
loadData();
}

/* LOAD */
window.loadData = async function(){
let data=document.getElementById("data");
data.innerHTML="";

const q = await getDocs(collection(db,"clients"));

q.forEach(doc=>{
let b=doc.data();
data.innerHTML += `
<div>
👤 ${b.name}<br>
📞 ${b.phone}<br>
🎯 ${b.service}
</div>`;
});
}

loadData();

</script>

<!-- EMAIL JS -->
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script>
emailjs.init("YOUR_PUBLIC_KEY");

function sendEmail(name,phone,service){
emailjs.send("service_id","template_id",{
name,phone,service
});
}
</script>

<!-- EXCEL -->
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<script>
async function exportExcel(){

const q = await window.getDocs(window.collection(window.db,"clients"));

let data = [];

q.forEach(doc=>{
let b = doc.data();
data.push({
"Name":b.name,
"Phone":b.phone,
"Service":b.service
});
});

let ws = XLSX.utils.json_to_sheet(data);
let wb = XLSX.utils.book_new();
XLSX.utils.book_append_sheet(wb,ws,"Clients");

XLSX.writeFile(wb,"bookings.xlsx");
}
</script>

<!-- PROJECTS -->
<script>
const container=document.getElementById("projects");

for(let i=1;i<=9;i++){
let div=document.createElement("div");
div.className="project";
div.innerHTML=`<img src="${i}.jpg">`;
container.appendChild(div);
}
</script>

</body>
</html>
